<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Virtual Studio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- fonts -->
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- navbar -->
    <header class="navbar">
        <h1 class="logo">Virtual Studio</h1>

        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Commissions</a></li>
            </ul>
        </nav>

        <button id="theme-toggle">🌙</button>
    </header>

    <!-- hero? -->
    <section class="hero">
        <div class="hero-content">
            <h2>Interactive Digital Art Portfolio</h2>

            <p>
                A creative space where art and technology meet!
            </p>

            <button class="explore-btn">
                Explore Gallery
            </button>
        </div>
    </section>

    <!-- gallery section -->
    <section class="gallery-section">

        <h2 class="section-title">Featured Artwork</h2>

        <div class="gallery-grid">

            <!-- card 1 -->
            <div class="art-card">
                <img src="assets/images/art1.jpg" alt="Artwork 1">

                <div class="card-content">
                    <h3>Dreamscape</h3>
                    <p>Digital Illustration</p>
                </div>
            </div>

            <!-- card 2 -->
            <div class="art-card">
                <img src="assets/images/art2.jpg" alt="Artwork 2">

                <div class="card-content">
                    <h3>Neon City</h3>
                    <p>Concept Art</p>
                </div>
            </div>

            <!-- card 3 -->
            <div class="art-card">
                <img src="assets/images/art3.jpg" alt="Artwork 3">

                <div class="card-content">
                    <h3>Celestial</h3>
                    <p>Fantasy Design</p>
                </div>
            </div>
        </div>
    </section>
    
    <!-- JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
